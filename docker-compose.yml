x-fvnli: &fvnli
  image: ${DOCKER_IMAGE}
x-db: &db
  image: postgres:17.4
x-redis: &redis
  image: redis:7

services:
  app:
    <<: *fvnli
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - fvnli
      - web
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
      - /opt/renpy-sdk:/opt/renpy-sdk
      - ./:/app/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https"
  db:
    <<: *db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=6GB"
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
  redis:
    <<: *redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - "60 1"
    networks:
      - fvnli
    volumes:
      - redis:/data

volumes:
  app_storage:
    name: ${COMPOSE_PROJECT_NAME}_app_storage
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  db:
    name: ${COMPOSE_PROJECT_NAME}_db
  redis:
    name: ${COMPOSE_PROJECT_NAME}_redis

networks:
  fvnli:
    name: ${COMPOSE_PROJECT_NAME}
  web:
    name: web
    external: true
