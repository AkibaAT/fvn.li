site_name: FVN.li Documentation
site_url: https://akibaat.github.io/fvn.li/
repo_url: https://github.com/AkibaAT/fvn.li

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - redirects:
      redirect_maps:
        commands-overview.md: commands/index.md
        development-guide.md: development/index.md
        feed-commands-overview.md: commands/feed/index.md
        feed-process.md: commands/feed/process.md
        fix-characters.md: commands/fix/characters.md
        fix-commands-overview.md: commands/fix/index.md
        fix-platforms-incremental-support.md: commands/fix/platforms/incremental-support.md
        frontend-architecture.md: development/frontend-architecture.md
        game-jams-commands-overview.md: commands/game-jams/index.md
        game-jams-fetch-details.md: commands/game-jams/fetch-details.md
        games-check-delisted.md: commands/games/check-delisted.md
        games-cleanup-downloads.md: commands/games/cleanup-downloads.md
        games-commands-overview.md: commands/games/index.md
        games-import-stats.md: commands/games/import-stats.md
        games-process-screenshots.md: commands/games/process-screenshots.md
        games-process-thumbnails.md: commands/games/process-thumbnails.md
        games-refresh-feedless.md: commands/games/refresh-feedless.md
        games-refresh.md: commands/games/refresh.md
        games-reimport-version.md: commands/games/reimport-version.md
        games-update-watchlist.md: commands/games/update-watchlist.md
        meilisearch-commands-overview.md: commands/meilisearch/index.md
        meilisearch-reindex.md: commands/meilisearch/reindex.md
        meilisearch-setup.md: commands/meilisearch/setup.md
        notifications-commands-overview.md: commands/notifications/index.md
        notifications-process-push.md: commands/notifications/process-push.md
        notifications-queue-game-updates.md: commands/notifications/queue-game-updates.md
        rater-commands-overview.md: commands/rater/index.md
        rater-mark-suspicious.md: commands/rater/mark-suspicious.md
        ratings-backfill.md: commands/ratings/backfill.md
        ratings-commands-overview.md: commands/ratings/index.md
        ratings-import.md: commands/ratings/import.md
        ratings-recalculate.md: commands/ratings/recalculate.md
        scout-sync-index-settings.md: commands/meilisearch/sync-index-settings.md
        sitemap-commands-overview.md: commands/sitemap/index.md
        sitemap-generate.md: commands/sitemap/generate.md

