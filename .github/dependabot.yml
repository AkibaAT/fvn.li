version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      php-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docker/social-images"
    schedule:
      interval: "weekly"
    groups:
      social-image-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/social-images"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker/production"
    schedule:
      interval: "weekly"
