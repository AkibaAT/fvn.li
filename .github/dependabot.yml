version: 2
updates:
  - package-ecosystem: 'composer'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      php-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      frontend-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/docker/social-images'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      social-image-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/docker/app'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3

  - package-ecosystem: 'docker'
    directory: '/docker/social-images'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3

  - package-ecosystem: 'docker-compose'
    directory: '/docker/production'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3

  - package-ecosystem: 'docker-compose'
    directory: '/.ddev'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
