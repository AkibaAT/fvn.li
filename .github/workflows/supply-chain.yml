name: Supply Chain Security

on:
  pull_request:
    branches:
      - development
      - production
  push:
    branches:
      - development
      - production
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'bunfig.toml'
      - 'bun.lock'
      - 'composer.json'
      - 'composer.lock'
      - 'docker/**'
      - '.ddev/web-build/**'
      - 'tests/security/**'
      - 'package.json'
      - 'scripts/check-github-actions-pinned.sh'
      - 'scripts/check-js-dependency-sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require pinned GitHub Actions
        run: scripts/check-github-actions-pinned.sh

      - name: Require registry-based JS dependencies
        run: scripts/check-js-dependency-sources.py

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  audits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Audit Composer lockfile
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Verify Bun lockfile
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python3 -m unittest discover -s tests/security
          bun install --frozen-lockfile

      - name: Audit Bun lockfile
        run: bun audit

      - name: Audit social image generator dependencies
        working-directory: docker/social-images
        run: npm audit --audit-level=high --omit=dev

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Bun dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          python3 -m unittest discover -s tests/security
          bun install --frozen-lockfile

      - name: Type check frontend
        run: bun types

      - name: Lint frontend
        run: bun lint:check

      - name: Build frontend assets
        run: bun run build:ssr
