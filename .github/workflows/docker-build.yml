name: Build, Publish and Deploy Docker Container

on:
  push:
    branches:
      - development
      - production
    tags:
      - 'v*'

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}
          cache-from: |
            type=gha,scope=docker-cache-amd64
            type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}:buildcache-amd64
          cache-to: |
            type=gha,mode=max,scope=docker-cache-amd64
            type=registry,ref=ghcr.io/${{ env.REPO_LOWER }}:buildcache-amd64,mode=max
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }},push-by-digest=false,push=true,name-canonical=false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [[ "${{ github.ref_name }}" == "production" || "${{ github.ref_name }}" == v* ]]; then
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "No deployment configured for branch ${{ github.ref_name }}"
            exit 0
          fi

      - name: Update docker-compose.yml with current image tag
        run: |
          sed -i "s|image: ghcr.io/${{ env.REPO_LOWER }}:.*|image: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}|g" docker-compose.yml
          if [[ "${{ github.ref_name }}" == "development" ]]; then
            # Change the port mapping for db from 5432 to 5433
            sed -i 's|"127.0.0.1:5432:5432"|"127.0.0.1:5433:5432"|g' docker-compose.yml
            sed -i "s|name: fvnli|name: betafvnli|g" docker-compose.yml
          fi
          cat docker-compose.yml

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_PATH }}"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # Deploy
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose exec app php artisan migrate --force
            docker compose ps
