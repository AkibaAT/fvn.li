name: Build, Publish and Deploy Docker Container

on:
  push:
    branches:
      - development
      - production
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        platform: [ amd64, arm64 ]
        include:
          - platform: amd64
            runs-on: ubuntu-24.04
          - platform: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          platforms: linux/${{ matrix.platform }}
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-${{ matrix.platform }},push-by-digest=false,push=true,name-canonical=false

  merge-manifests:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Create and push multi-arch manifest
        uses: Noelware/docker-manifest-action@master
        with:
          inputs: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}
          images: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-amd64,ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-arm64
          push: true

      - name: Create and push latest manifest
        if: ${{ github.ref_name == 'production' || startsWith(github.ref_name, 'v') }}
        uses: Noelware/docker-manifest-action@master
        with:
          inputs: ghcr.io/${{ env.REPO_LOWER }}:latest
          images: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-amd64,ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}-arm64
          push: true

  deploy:
    needs: merge-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          if [[ "${{ github.ref_name }}" == "production" || "${{ github.ref_name }}" == v* ]]; then
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "development" ]]; then
            echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "No deployment configured for branch ${{ github.ref_name }}"
            exit 0
          fi

      - name: Update docker-compose.yml with current image tag
        run: |
          sed -i "s|image: ghcr.io/${{ env.REPO_LOWER }}:.*|image: ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}|g" docker-compose.yml
          if [[ "${{ github.ref_name }}" == "development" ]]; then
            # Change the port mapping for db from 5432 to 5433
            sed -i 's|"127.0.0.1:5432:5432"|"127.0.0.1:5433:5432"|g' docker-compose.yml
            sed -i "s|name: fvnli|name: betafvnli|g" docker-compose.yml
          fi
          cat docker-compose.yml

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_PATH }}"

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p ${{ env.DEPLOY_PATH }}
            cd ${{ env.DEPLOY_PATH }}

            # Deploy
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose exec app php artisan config:clear
            docker compose exec app php artisan migrate
            docker compose ps
