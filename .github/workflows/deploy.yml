name: Build and Deploy

on:
  push:
    branches:
      - development
      - production
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      force_app_image:
        description: Rebuild and redeploy the main application Docker image
        required: false
        default: false
        type: boolean
      force_social_images:
        description: Rebuild and redeploy the social image generator Docker image
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1
        with:
          autostart: false

      - name: Start DDEV
        run: |
          sudo mkdir -p /tmp/fvn-empty-renpy-sdk
          # The Butler DDEV service mounts developer-local checkouts that are not present in CI.
          rm -f .ddev/docker-compose.butler-server.yaml
          ddev start -y
          ddev describe

      - name: Install Composer dependencies
        run: ddev composer install --no-interaction --prefer-dist --no-progress

      - name: Install Bun dependencies
        run: ddev bun install --frozen-lockfile

      - name: Validate Composer config
        run: ddev composer validate --no-check-publish

      - name: Audit Composer dependencies
        run: ddev composer audit --locked --no-interaction

      - name: Audit Bun dependencies
        run: ddev bun audit --audit-level=high

      - name: Check patch whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Type check frontend
        run: ddev bun types

      - name: Lint frontend
        run: ddev bun lint:check

      - name: Wait for Meilisearch
        run: |
          ddev exec bash -lc 'for i in {1..30}; do curl -fsS http://meilisearch:7700/health && exit 0; sleep 2; done; exit 1'

      - name: Run test suite
        run: ddev composer test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            build/frontend-coverage
            playwright-report
            test-results
            tests/e2e/reports
            storage/logs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # Needed to check the full pushed range for file changes

      - name: Set deployment variables
        id: vars
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REF_NAME="${{ github.ref_name }}"
          echo "REF_NAME=$REF_NAME" >> $GITHUB_ENV

          if [[ "$REF_NAME" == "production" ]]; then
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          elif [[ "$REF_NAME" == "development" ]]; then
            echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "No deployment configured for branch $REF_NAME"
            exit 0
          fi

          FORCE_APP_IMAGE="${{ inputs.force_app_image || false }}"
          FORCE_SOCIAL_IMAGES="${{ inputs.force_social_images || false }}"

          CHANGED_FILES="$(mktemp)"
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "push" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > "$CHANGED_FILES"
          else
            git ls-tree -r --name-only HEAD > "$CHANGED_FILES"
          fi

          # Check if Dockerfile or related files have changed
          DOCKERFILE_CHANGED=false
          grep -q -E '^docker/(app/.*|production/docker-compose\.yml)$' "$CHANGED_FILES" && DOCKERFILE_CHANGED=true
          [[ "$FORCE_APP_IMAGE" == "true" ]] && DOCKERFILE_CHANGED=true
          echo "dockerfile_changed=$DOCKERFILE_CHANGED" >> $GITHUB_OUTPUT

          # Check if social image generator Dockerfile or script changed
          SOCIAL_IMAGES_CHANGED=false
          grep -q -E '^docker/social-images/.*$' "$CHANGED_FILES" && SOCIAL_IMAGES_CHANGED=true
          [[ "$FORCE_SOCIAL_IMAGES" == "true" ]] && SOCIAL_IMAGES_CHANGED=true
          echo "social_images_changed=$SOCIAL_IMAGES_CHANGED" >> $GITHUB_OUTPUT

          echo "Changed files considered for Docker rebuilds:"
          cat "$CHANGED_FILES"
          echo "force_app_image=$FORCE_APP_IMAGE"
          echo "force_social_images=$FORCE_SOCIAL_IMAGES"
          echo "dockerfile_changed=$DOCKERFILE_CHANGED"
          echo "social_images_changed=$SOCIAL_IMAGES_CHANGED"

      # Build and push Docker images if Dockerfile or related files changed
      - name: Set up Docker Buildx
        if: steps.vars.outputs.dockerfile_changed == 'true' || steps.vars.outputs.social_images_changed == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: image=moby/buildkit:v0.26.3@sha256:5601811fde88bb9e8a577bfe804af82bccb712e1cd07ff94663bded5e628cf75

      - name: Log in to Docker Hub
        if: steps.vars.outputs.dockerfile_changed == 'true' || steps.vars.outputs.social_images_changed == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fvn.li
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.vars.outputs.dockerfile_changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-amd64
          cache-to: |
            type=gha,mode=max,scope=docker-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-amd64,mode=max

      - name: Build and push social images generator Docker image
        if: steps.vars.outputs.social_images_changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: docker/social-images
          file: docker/social-images/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:${{ env.REF_NAME }}-social-images
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=social-images-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-social-images-amd64
          cache-to: |
            type=gha,mode=max,scope=social-images-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-social-images-amd64,mode=max

      # Always run these steps for code deployment
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_mysql, pdo_pgsql, exif, pcntl, gd, intl, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        name: Install Bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build assets
        run: bun run build:ssr

      - name: Create or update .env file with deployment configuration
        run: ./scripts/create-env-deploy.sh "${{ steps.meta.outputs.tags }}" "${{ steps.vars.outputs.dockerfile_changed }}" "${{ steps.vars.outputs.social_images_changed }}"

      - name: move docker-compose.yml
        run: mv docker/production/docker-compose.yml docker-compose.yml

      - name: Deploy to server using rsync
        uses: burnett01/rsync-deployments@66257cad6bfeb2171d3b6bfa6c9a22279dd9c3a1 # 8.0.5
        with:
          switches: -rlptvz --delete --dirs --exclude-from=scripts/rsync-exclude.txt --chmod=D2775,F664,F+X
          path: ./
          remote_path: ${{ env.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Execute deployment script
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            bash ./scripts/deploy.sh
