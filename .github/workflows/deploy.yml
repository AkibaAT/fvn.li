name: Build and Deploy

on:
  push:
    branches:
      - development
      - production
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1
        with:
          autostart: false

      - name: Start DDEV
        run: |
          sudo mkdir -p /tmp/fvn-empty-renpy-sdk
          ddev start -y
          ddev describe

      - name: Install Composer dependencies
        run: ddev composer install --no-interaction --prefer-dist

      - name: Install Bun dependencies
        run: ddev bun install --frozen-lockfile

      - name: Validate Composer config
        run: ddev composer validate --no-check-publish

      - name: Check patch whitespace
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Type check frontend
        run: ddev bun types

      - name: Lint frontend
        run: ddev bun lint:check

      - name: Run test suite
        run: ddev composer test

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            build/frontend-coverage
            playwright-report
            test-results
            tests/e2e/reports
            storage/logs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2 # Needed to check for file changes

      - name: Set deployment variables
        id: vars
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REF_NAME="${{ github.ref_name }}"
          echo "REF_NAME=$REF_NAME" >> $GITHUB_ENV

          if [[ "$REF_NAME" == "production" ]]; then
            echo "DEPLOY_PATH=${{ secrets.PROD_DEPLOY_PATH }}" >> $GITHUB_ENV
          elif [[ "$REF_NAME" == "development" ]]; then
            echo "DEPLOY_PATH=${{ secrets.DEV_DEPLOY_PATH }}" >> $GITHUB_ENV
          else
            echo "No deployment configured for branch $REF_NAME"
            exit 0
          fi

          # Check if Dockerfile or related files have changed
          DOCKERFILE_CHANGED=false
          git diff --name-only HEAD^ HEAD | grep -q -E '^docker/(app/.*|production/docker-compose\.yml)$' && DOCKERFILE_CHANGED=true
          echo "dockerfile_changed=$DOCKERFILE_CHANGED" >> $GITHUB_OUTPUT

          # Check if social image generator Dockerfile or script changed
          SOCIAL_IMAGES_CHANGED=false
          git diff --name-only HEAD^ HEAD | grep -q -E '^docker/social-images/.*$' && SOCIAL_IMAGES_CHANGED=true
          echo "social_images_changed=$SOCIAL_IMAGES_CHANGED" >> $GITHUB_OUTPUT

      # Build and push Docker images if Dockerfile or related files changed
      - name: Set up Docker Buildx
        if: steps.vars.outputs.dockerfile_changed == 'true' || steps.vars.outputs.social_images_changed == 'true'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Docker Hub
        if: steps.vars.outputs.dockerfile_changed == 'true' || steps.vars.outputs.social_images_changed == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fvn.li
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.vars.outputs.dockerfile_changed == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-amd64
          cache-to: |
            type=gha,mode=max,scope=docker-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-amd64,mode=max

      - name: Build and push social images generator Docker image
        if: steps.vars.outputs.social_images_changed == 'true'
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: docker/social-images
          file: docker/social-images/Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:${{ env.REF_NAME }}-social-images
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=social-images-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-social-images-amd64
          cache-to: |
            type=gha,mode=max,scope=social-images-cache-amd64
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/fvn.li:buildcache-social-images-amd64,mode=max

      # Always run these steps for code deployment
      - name: Setup PHP
        uses: shivammathur/setup-php@728c6c6b8cf02c2e48117716a91ee48313958a19 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_mysql, pdo_pgsql, exif, pcntl, gd, intl, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        name: Install Bun

      - name: Install dependencies
        run: bun install

      - name: Build assets
        run: bun run build:ssr

      - name: Create or update .env file with deployment configuration
        run: ./scripts/create-env-deploy.sh "${{ steps.meta.outputs.tags }}" "${{ steps.vars.outputs.dockerfile_changed }}" "${{ steps.vars.outputs.social_images_changed }}"

      - name: move docker-compose.yml
        run: mv docker/production/docker-compose.yml docker-compose.yml

      - name: Deploy to server using rsync
        uses: burnett01/rsync-deployments@dc0d5d44c4728aad3f02154a87309809e62a960f # 8.0.4
        with:
          switches: -avz --delete --dirs  --exclude-from=scripts/rsync-exclude.txt --rsync-path="sudo rsync" --chown=www-data:www-data
          path: ./
          remote_path: ${{ env.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Execute deployment script
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            ./scripts/deploy.sh
