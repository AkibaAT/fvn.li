            type: http
            scheme: bearer
            description: 'User API token created on the dashboard and shown once. Tokens expire 90 days after creation; an active token can be extended on the dashboard to 90 days from extension, capped at 365 days from creation. Authenticated responses carry the expiry in X-Token-Expires-At.'
    parameters:
        Page:
            name: page
            in: query
            schema:
                type: integer
                minimum: 1
        Game:
            name: game
            in: path
            required: true
            schema:
                type: integer
            description: 'fvn.li game ID'
        Tag:
            name: tag
            in: path
            required: true
            schema:
                type: integer
        List:
            name: list
            in: path
            required: true
            schema:
                type: integer
        Entry:
            name: entry
            in: path
            required: true
            schema:
                type: integer
    requestBodies:
        TagName:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required:
                            - name
                        properties:
                            name:
                                type: string
                                maxLength: 64
                                description: 'Unique per user ignoring case'
                    example:
                        name: 'Waiting on next update'
        ListCreate:
            required: true
            content:
                application/json:
                    schema:
                        allOf:
                            - $ref: '#/components/schemas/ListInput'
                            - required:
                                  - name
                    example:
                        name: 'Cozy picks'
                        description: 'Low-stress stories to recommend to friends.'
                        is_public: true
        ListUpdate:
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ListInput'
                    example:
                        name: 'Cozy picks for autumn'
                        is_public: false
    responses:
        Unauthorized:
            description: 'Missing, invalid, or expired token'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Message'
                    example:
                        message: Unauthenticated.
        Forbidden:
            description: 'Token lacks the required ability or action is forbidden'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Message'
                    examples:
                        missingAbility:
                            summary: 'Token lacks the required permission'
                            value:
                                message: 'This token lacks the lists:read permission.'
                        defaultList:
                            summary: 'Default lists cannot be deleted'
                            value:
                                message: 'Default lists cannot be deleted.'
        NotFound:
            description: 'Not found or not visible to this token owner'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Message'
                    examples:
                        notFound:
                            summary: "Unknown, hidden, or another account's resource"
                            value:
                                message: 'Not found.'
                        gameNotFound:
                            summary: 'No catalog game matches the identifier'
                            value:
                                message: 'Game not found.'
        Conflict:
            description: 'Ambiguous identifier or conflicting list move'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Message'
                    examples:
                        ambiguous:
                            summary: 'Identifier matches more than one game'
                            value:
                                message: 'Identifier matches multiple games.'
                        alreadyInList:
                            summary: 'Target list already contains the game'
                            value:
                                message: 'Game is already in the target list.'
        ValidationError:
            description: 'Validation failed'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationError'
                    examples:
                        duplicateTag:
                            summary: 'Private tag names are unique per account, ignoring case'
                            value:
                                message: 'You already have a tag with this name.'
                                errors:
                                    name:
                                        - 'You already have a tag with this name.'
                        incompleteReorder:
                            summary: 'Reorder must list every entry exactly once'
                            value:
                                message: 'Provide every entry in this list exactly once.'
                                errors:
                                    entry_ids:
                                        - 'Provide every entry in this list exactly once.'
                        paidUpdates:
                            summary: 'Paid games cannot receive update notifications'
                            value:
                                message: 'Updates are unavailable for paid games.'
                                errors:
                                    is_receiving_updates:
                                        - 'Updates are unavailable for paid games.'
                        unknownLanguage:
                            summary: 'Languages are ISO 639-3 codes'
                            value:
                                message: 'The selected preferred_languages.0 is invalid.'
                                errors:
                                    preferred_languages.0:
                                        - 'The selected preferred_languages.0 is invalid.'
        RateLimited:
            description: 'Rate limit exceeded'
            headers:
                Retry-After:
                    description: 'Seconds until retry'
                    schema:
                        type: integer
                X-RateLimit-Limit:
                    schema:
                        type: integer
                X-RateLimit-Remaining:
                    schema:
                        type: integer
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Message'
                    example:
                        message: 'Too Many Attempts.'
    schemas:
        Message:
            type: object
            required:
                - message
            properties:
                message:
                    type: string
        ValidationError:
            type: object
            required:
                - message
                - errors
            properties:
                message:
                    type: string
                errors:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
        PageLinks:
            type: object
            required:
                - first
                - last
                - prev
                - next
            properties:
                first:
                    type:
                        - string
                        - 'null'
                last:
                    type:
                        - string
                        - 'null'
                prev:
                    type:
                        - string
                        - 'null'
                next:
                    type:
                        - string
                        - 'null'
        PageMeta:
            type: object
            required:
                - current_page
                - last_page
                - per_page
                - total
            properties:
                current_page:
                    type: integer
                from:
                    type:
                        - integer
                        - 'null'
                last_page:
                    type: integer
                links:
                    type: array
                    items:
                        type: object
                        properties:
                            url:
                                type:
                                    - string
                                    - 'null'
                            label:
                                type: string
                            page:
                                type:
                                    - integer
                                    - 'null'
                            active:
                                type: boolean
                path:
                    type: string
                per_page:
                    type: integer
                to:
                    type:
                        - integer
                        - 'null'
                total:
                    type: integer
        Game:
            type: object
            required:
                - id
                - name
                - slug
                - platform
                - itch_id
                - steam_app_id
                - urls
                - status
                - is_nsfw
                - is_paid
                - has_demo
                - fvn_url
            properties:
                id:
                    type: integer
                name:
                    type: string
                slug:
                    type: string
                platform:
                    type: string
                    enum:
                        - itch_io
                        - steam
                        - other
                itch_id:
                    type:
                        - integer
                        - 'null'
                steam_app_id:
                    type:
                        - integer
                        - 'null'
                urls:
                    type: object
                    properties:
                        itch_io:
                            type: string
                        steam:
                            type: string
                        other:
                            type: string
                status:
                    type:
                        - string
                        - 'null'
                is_nsfw:
                    type: boolean
                is_paid:
                    type: boolean
                has_demo:
                    type: boolean
                fvn_url:
                    type: string
                    format: uri
        GameSelector:
            description: 'Exactly one selector'
            oneOf:
                - type: object
                  required:
                      - itch_id
                  additionalProperties: false
                  properties:
                      itch_id:
                          type: integer
                          minimum: 1
                - type: object
                  required:
                      - steam_app_id
                  additionalProperties: false
                  properties:
                      steam_app_id:
                          type: integer
                          minimum: 1
                - type: object
                  required:
                      - url
                  additionalProperties: false
                  properties:
                      url:
                          type: string
                          format: uri
                          pattern: '^https?://'
                          maxLength: 2048
        ResolveResult:
            type: object
            required:
                - input
                - status
                - game
            properties:
                input:
                    $ref: '#/components/schemas/GameSelector'
                status:
                    type: string
                    enum:
                        - matched
                        - unmatched
                        - ambiguous
                game:
                    anyOf:
                        - $ref: '#/components/schemas/Game'
                        - type: 'null'
        PrivateTag:
            type: object
            required:
                - id
                - name
                - games_count
            properties:
                id:
                    type: integer
                name:
                    type: string
                games_count:
                    type: integer
        ListInput:
            type: object
            properties:
                name:
                    type: string
                    maxLength: 255
                    description: 'Unique among your lists'
                description:
                    type:
                        - string
                        - 'null'
                    maxLength: 1000
                is_public:
                    type: boolean
        List:
            type: object
            required:
                - id
                - name
                - description
                - type
                - is_default
                - is_public
                - entries_count
            properties:
                id:
                    type: integer
                name:
                    type: string
                description:
                    type:
                        - string
                        - 'null'
                type:
                    type: string
                is_default:
                    type: boolean
                is_public:
                    type: boolean
                entries_count:
                    type: integer
        ListEntry:
            type: object
            required:
                - id
                - list_id
                - game_id
                - sort_order
                - private_notes
                - game
            properties:
                id:
                    type: integer
                list_id:
                    type: integer
                game_id:
                    type: integer
                sort_order:
                    type: integer
                private_notes:
                    type:
                        - string
                        - 'null'
                game:
                    anyOf:
                        - $ref: '#/components/schemas/Game'
                        - type: 'null'
        Tracking:
            type: object
            required:
                - game_id
                - game
                - game_version_id
                - status
                - started_at
                - completed_at
                - personal_notes
                - is_receiving_updates
            properties:
                game_id:
                    type: integer
                game:
                    $ref: '#/components/schemas/Game'
                game_version_id:
                    type:
                        - integer
                        - 'null'
                status:
                    type:
                        - string
                        - 'null'
                started_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
                completed_at:
                    type:
                        - string
                        - 'null'
                    format: date-time
                personal_notes:
                    type:
                        - string
                        - 'null'
                is_receiving_updates:
                    type: boolean
        SearchPreferences:
            type: object
            required:
                - preferred_languages
                - excluded_tag_ids
            properties:
                preferred_languages:
                    type: array
                    items:
                        type: string
                excluded_tag_ids:
                    type: array
                    items:
                        type: integer
        GameResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/Game'
        TagResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/PrivateTag'
        ListResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/List'
        EntryResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/ListEntry'
        TrackingResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/Tracking'
        PreferencesResponse:
            type: object
            required:
                - data
            properties:
                data:
                    $ref: '#/components/schemas/SearchPreferences'
        TagCollection:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/PrivateTag'
        ResolveResponse:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResolveResult'
        GamePage:
            allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Game'
        ListPage:
            allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/List'
        EntryPage:
            allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/ListEntry'
        TrackingPage:
            allOf:
                - $ref: '#/components/schemas/PageEnvelope'
                - type: object
                  properties:
                      data:
                          type: array
                          items:
                              $ref: '#/components/schemas/Tracking'
        PageEnvelope:
            type: object
            required:
                - data
                - links
                - meta
            properties:
                links:
                    $ref: '#/components/schemas/PageLinks'
                meta:
                    $ref: '#/components/schemas/PageMeta'
        EntryList:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/ListEntry'
