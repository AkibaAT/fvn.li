openapi: 3.1.0
info:
    title: 'fvn.li User API'
    version: 1.0.0
    license:
        name: MIT
        identifier: MIT
    description: "Visible catalog games and the token owner's private tags, lists, tracking, and search preferences. Ratings, reviews, profile, export, account deletion, social account linking, and token management are website-only."
servers:
    - url: /api/v1
security:
    - bearerAuth: []
tags:
    - name: Catalog
      description: 'Search and resolve visible games'
    - name: 'Private tags'
      description: 'Labels private to your account'
    - name: Lists
      description: 'Your lists and entries'
    - name: Tracking
      description: 'Your tracked games'
    - name: Preferences
      description: 'Search preferences and ignored games'
x-rate-limits:
    description: 'Limits apply per user account and are shared by all of its tokens.'
    requests_per_minute: 120
    writes_per_minute: 30
    batch_lookups_per_minute: 10
    headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - Retry-After
paths:
    /games:
        get:
            tags:
                - Catalog
            operationId: getGames
            summary: 'Search visible catalog games'
            x-required-ability: 'catalog:read'
            parameters:
                - name: q
                  in: query
                  schema:
                      type: string
                      maxLength: 100
                - name: platform
                  in: query
                  schema:
                      type: string
                      enum:
                          - itch_io
                          - steam
                          - other
                - name: per_page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 50
                - $ref: '#/components/parameters/Page'
            responses:
                '200':
                    description: Games
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GamePage'
                            example:
                                data:
                                    - id: 368
                                      name: 'TRAINEE DETECTIVE (EN)'
                                      slug: trainee-detective-en
                                      platform: itch_io
                                      itch_id: 2241851
                                      steam_app_id: null
                                      urls:
                                          itch_io: 'https://starnathy-arts.itch.io/trainee-detective-en'
                                      status: Released
                                      is_nsfw: false
                                      is_paid: true
                                      has_demo: true
                                      fvn_url: 'https://fvn.li/games/trainee-detective-en'
                                    - id: 402963
                                      name: 'Dragon Detective: A Friend from the Shadows'
                                      slug: dragon-detective-a-friend-from-the-shadows
                                      platform: steam
                                      itch_id: null
                                      steam_app_id: 3640850
                                      urls:
                                          steam: 'https://store.steampowered.com/app/3640850/Dragon_Detective_A_Friend_from_the_Shadows/'
                                      status: Released
                                      is_nsfw: false
                                      is_paid: true
                                      has_demo: true
                                      fvn_url: 'https://fvn.li/games/dragon-detective-a-friend-from-the-shadows'
                                links:
                                    first: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=1'
                                    last: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=2'
                                    prev: null
                                    next: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=2'
                                meta:
                                    current_page: 1
                                    from: 1
                                    last_page: 2
                                    links:
                                        - url: null
                                          label: '&laquo; Previous'
                                          page: null
                                          active: false
                                        - url: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=1'
                                          label: '1'
                                          page: 1
                                          active: true
                                        - url: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=2'
                                          label: '2'
                                          page: 2
                                          active: false
                                        - url: 'https://fvn.li/api/v1/games?q=detective&per_page=2&page=2'
                                          label: 'Next &raquo;'
                                          page: 2
                                          active: false
                                    path: 'https://fvn.li/api/v1/games'
                                    per_page: 2
                                    to: 2
                                    total: 3
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
    /games/resolve:
        get:
            tags:
                - Catalog
            operationId: getGamesResolve
            summary: 'Resolve one exact external identifier or stored platform URL'
            description: 'Supply exactly one selector. URLs match stored platform URLs ignoring scheme, host case, query, fragment, and trailing slash.'
            x-required-ability: 'catalog:read'
            parameters:
                - name: itch_id
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                - name: steam_app_id
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                - name: url
                  in: query
                  schema:
                      type: string
                      format: uri
                      pattern: '^https?://'
                      maxLength: 2048
            responses:
                '200':
                    description: Match
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameResponse'
                            example:
                                data:
                                    id: 406486
                                    name: Komorebi
                                    slug: komobrebi
                                    platform: steam
                                    itch_id: null
                                    steam_app_id: 1805130
                                    urls:
                                        steam: 'https://store.steampowered.com/app/1805130/Komorebi/'
                                    status: Released
                                    is_nsfw: false
                                    is_paid: true
                                    has_demo: false
                                    fvn_url: 'https://fvn.li/games/komobrebi'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '409':
                    $ref: '#/components/responses/Conflict'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
        post:
            tags:
                - Catalog
            operationId: postGamesResolve
            summary: 'Resolve up to 50 identifiers in input order'
            description: 'Each result reports matched, unmatched, or ambiguous. One invalid input rejects the whole batch with 422.'
            x-required-ability: 'catalog:read'
            x-additional-rate-limit: '10 requests per minute per account'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - items
                            properties:
                                items:
                                    type: array
                                    minItems: 1
                                    maxItems: 50
                                    items:
                                        $ref: '#/components/schemas/GameSelector'
                        example:
                            items:
                                - itch_id: 708589
                                - url: 'https://store.steampowered.com/app/1805130/Komorebi/?curator_clanid=1'
                                - url: 'https://example.itch.io/not-in-the-catalog'
            responses:
                '200':
                    description: 'Ordered results'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveResponse'
                            example:
                                data:
                                    - input:
                                          itch_id: 708589
                                      status: matched
                                      game:
                                          id: 194
                                          name: 'Dawn Chorus'
                                          slug: dawn-chorus
                                          platform: itch_io
                                          itch_id: 708589
                                          steam_app_id: null
                                          urls:
                                              itch_io: 'https://dawn-chorus.itch.io/dawn-chorus'
                                          status: 'In development'
                                          is_nsfw: false
                                          is_paid: false
                                          has_demo: false
                                          fvn_url: 'https://fvn.li/games/dawn-chorus'
                                    - input:
                                          url: 'https://store.steampowered.com/app/1805130/Komorebi/?curator_clanid=1'
                                      status: matched
                                      game:
                                          id: 406486
                                          name: Komorebi
                                          slug: komobrebi
                                          platform: steam
                                          itch_id: null
                                          steam_app_id: 1805130
                                          urls:
                                              steam: 'https://store.steampowered.com/app/1805130/Komorebi/'
                                          status: Released
                                          is_nsfw: false
                                          is_paid: true
                                          has_demo: false
                                          fvn_url: 'https://fvn.li/games/komobrebi'
                                    - input:
                                          url: 'https://example.itch.io/not-in-the-catalog'
                                      status: unmatched
                                      game: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/games/{game}':
        get:
            tags:
                - Catalog
            operationId: getGamesGame
            summary: 'Get a visible catalog game'
            x-required-ability: 'catalog:read'
            parameters:
                - $ref: '#/components/parameters/Game'
            responses:
                '200':
                    description: Game
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GameResponse'
                            example:
                                data:
                                    id: 407746
                                    name: 'Chicken Police - Paint it RED!'
                                    slug: chicken-police-paint-it-red
                                    platform: steam
                                    itch_id: null
                                    steam_app_id: 1084640
                                    urls:
                                        steam: 'https://store.steampowered.com/app/1084640/Chicken_Police__Paint_it_RED/'
                                    status: Released
                                    is_nsfw: false
                                    is_paid: true
                                    has_demo: true
                                    fvn_url: 'https://fvn.li/games/chicken-police-paint-it-red'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    /private-tags:
        get:
            tags:
                - 'Private tags'
            operationId: getPrivateTags
            summary: 'List my private tags'
            x-required-ability: 'tags:read'
            responses:
                '200':
                    description: Tags
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagCollection'
                            example:
                                data:
                                    - id: 4
                                      name: 'Replay for the true ending'
                                      games_count: 1
                                    - id: 3
                                      name: 'Waiting on next update'
                                      games_count: 2
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
        post:
            tags:
                - 'Private tags'
            operationId: postPrivateTags
            summary: 'Create a private tag'
            x-required-ability: 'tags:write'
            requestBody:
                $ref: '#/components/requestBodies/TagName'
            responses:
                '201':
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                            example:
                                data:
                                    id: 3
                                    name: 'Waiting on next update'
                                    games_count: 0
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/private-tags/{tag}':
        patch:
            tags:
                - 'Private tags'
            operationId: patchPrivateTagsTag
            summary: 'Rename my private tag'
            x-required-ability: 'tags:write'
            parameters:
                - $ref: '#/components/parameters/Tag'
            requestBody:
                $ref: '#/components/requestBodies/TagName'
            responses:
                '200':
                    description: Tag
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                            example:
                                data:
                                    id: 4
                                    name: 'Replay: true ending'
                                    games_count: 1
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
        delete:
            tags:
                - 'Private tags'
            operationId: deletePrivateTagsTag
            summary: 'Delete my private tag'
            x-required-ability: 'tags:write'
            parameters:
                - $ref: '#/components/parameters/Tag'
            responses:
                '204':
                    description: Deleted
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/private-tags/{tag}/games':
        get:
            tags:
                - 'Private tags'
            operationId: getPrivateTagsTagGames
            summary: 'List visible games with my tag'
            x-required-ability: 'tags:read'
            parameters:
                - $ref: '#/components/parameters/Tag'
                - $ref: '#/components/parameters/Page'
            responses:
                '200':
                    description: Games
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GamePage'
                            example:
                                data:
                                    - id: 194
                                      name: 'Dawn Chorus'
                                      slug: dawn-chorus
                                      platform: itch_io
                                      itch_id: 708589
                                      steam_app_id: null
                                      urls:
                                          itch_io: 'https://dawn-chorus.itch.io/dawn-chorus'
                                      status: 'In development'
                                      is_nsfw: false
                                      is_paid: false
                                      has_demo: false
                                      fvn_url: 'https://fvn.li/games/dawn-chorus'
                                    - id: 256
                                      name: Starville
                                      slug: starville
                                      platform: itch_io
                                      itch_id: 1253905
                                      steam_app_id: null
                                      urls:
                                          itch_io: 'https://mister-gato.itch.io/starville'
                                      status: 'In development'
                                      is_nsfw: false
                                      is_paid: false
                                      has_demo: false
                                      fvn_url: 'https://fvn.li/games/starville'
                                links:
                                    first: 'https://fvn.li/api/v1/private-tags/3/games?page=1'
                                    last: 'https://fvn.li/api/v1/private-tags/3/games?page=1'
                                    prev: null
                                    next: null
                                meta:
                                    current_page: 1
                                    from: 1
                                    last_page: 1
                                    links:
                                        - url: null
                                          label: '&laquo; Previous'
                                          page: null
                                          active: false
                                        - url: 'https://fvn.li/api/v1/private-tags/3/games?page=1'
                                          label: '1'
                                          page: 1
                                          active: true
                                        - url: null
                                          label: 'Next &raquo;'
                                          page: null
                                          active: false
                                    path: 'https://fvn.li/api/v1/private-tags/3/games'
                                    per_page: 20
                                    to: 2
                                    total: 2
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/games/{game}/private-tags':
        get:
            tags:
                - 'Private tags'
            operationId: getGamesGamePrivateTags
            summary: 'List my tags on one game'
            x-required-ability: 'tags:read'
            parameters:
                - $ref: '#/components/parameters/Game'
            responses:
                '200':
                    description: Tags
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagCollection'
                            example:
                                data:
                                    - id: 3
                                      name: 'Waiting on next update'
                                      games_count: 2
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/games/{game}/private-tags/{tag}':
        put:
            tags:
                - 'Private tags'
            operationId: putGamesGamePrivateTagsTag
            summary: 'Attach my tag to a visible game'
            x-required-ability: 'tags:write'
            parameters:
                - $ref: '#/components/parameters/Game'
                - $ref: '#/components/parameters/Tag'
            responses:
                '200':
                    description: Tag
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TagResponse'
                            example:
                                data:
                                    id: 3
                                    name: 'Waiting on next update'
                                    games_count: 1
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
        delete:
            tags:
                - 'Private tags'
            operationId: deleteGamesGamePrivateTagsTag
            summary: 'Detach my tag from a game'
            x-required-ability: 'tags:write'
            parameters:
                - $ref: '#/components/parameters/Game'
                - $ref: '#/components/parameters/Tag'
            responses:
                '204':
                    description: Detached
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    /lists:
        get:
            tags:
                - Lists
            operationId: getLists
            summary: 'List my lists'
            x-required-ability: 'lists:read'
            parameters:
                - $ref: '#/components/parameters/Page'
            responses:
                '200':
                    description: Lists
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPage'
                            example:
                                data:
                                    - id: 9180
                                      name: 'Currently Reading'
                                      description: null
                                      type: reading
                                      is_default: true
                                      is_public: false
                                      entries_count: 1
                                    - id: 9182
                                      name: 'Plan to Read'
                                      description: null
                                      type: plan_to_read
                                      is_default: true
                                      is_public: false
                                      entries_count: 1
                                    - id: 9181
                                      name: Completed
                                      description: null
                                      type: completed
                                      is_default: true
                                      is_public: false
                                      entries_count: 0
                                    - id: 9183
                                      name: 'On Hold'
                                      description: null
                                      type: on_hold
                                      is_default: true
                                      is_public: false
                                      entries_count: 0
                                    - id: 9184
                                      name: Dropped
                                      description: null
                                      type: dropped
                                      is_default: true
                                      is_public: false
                                      entries_count: 0
                                    - id: 9185
                                      name: 'Cozy picks for autumn'
                                      description: 'Low-stress stories to recommend to friends.'
                                      type: custom
                                      is_default: false
                                      is_public: false
                                      entries_count: 1
                                links:
                                    first: 'https://fvn.li/api/v1/lists?page=1'
                                    last: 'https://fvn.li/api/v1/lists?page=1'
                                    prev: null
                                    next: null
                                meta:
                                    current_page: 1
                                    from: 1
                                    last_page: 1
                                    links:
                                        - url: null
                                          label: '&laquo; Previous'
                                          page: null
                                          active: false
                                        - url: 'https://fvn.li/api/v1/lists?page=1'
                                          label: '1'
                                          page: 1
                                          active: true
                                        - url: null
                                          label: 'Next &raquo;'
                                          page: null
                                          active: false
                                    path: 'https://fvn.li/api/v1/lists'
                                    per_page: 20
                                    to: 6
                                    total: 6
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '429':
                    $ref: '#/components/responses/RateLimited'
        post:
            tags:
                - Lists
            operationId: postLists
            summary: 'Create a custom list'
            x-required-ability: 'lists:write'
            requestBody:
                $ref: '#/components/requestBodies/ListCreate'
            responses:
                '201':
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResponse'
                            example:
                                data:
                                    id: 9185
                                    name: 'Cozy picks'
                                    description: 'Low-stress stories to recommend to friends.'
                                    type: custom
                                    is_default: false
                                    is_public: true
                                    entries_count: 0
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/lists/{list}':
        get:
            tags:
                - Lists
            operationId: getListsList
            summary: 'Get my list'
            x-required-ability: 'lists:read'
            parameters:
                - $ref: '#/components/parameters/List'
            responses:
                '200':
                    description: List
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResponse'
                            example:
                                data:
                                    id: 9185
                                    name: 'Cozy picks for autumn'
                                    description: 'Low-stress stories to recommend to friends.'
                                    type: custom
                                    is_default: false
                                    is_public: false
                                    entries_count: 1
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
        patch:
            tags:
                - Lists
            operationId: patchListsList
            summary: 'Update my list'
            x-required-ability: 'lists:write'
            parameters:
                - $ref: '#/components/parameters/List'
            requestBody:
                $ref: '#/components/requestBodies/ListUpdate'
            responses:
                '200':
                    description: List
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResponse'
                            example:
                                data:
                                    id: 9185
                                    name: 'Cozy picks for autumn'
                                    description: 'Low-stress stories to recommend to friends.'
                                    type: custom
                                    is_default: false
                                    is_public: false
                                    entries_count: 1
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '422':
                    $ref: '#/components/responses/ValidationError'
                '429':
                    $ref: '#/components/responses/RateLimited'
        delete:
            tags:
                - Lists
            operationId: deleteListsList
            summary: 'Delete my custom list'
            description: 'Default lists cannot be deleted.'
            x-required-ability: 'lists:write'
            parameters:
                - $ref: '#/components/parameters/List'
            responses:
                '204':
                    description: Deleted
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/RateLimited'
    '/lists/{list}/entries':
        get:
            tags:
                - Lists
            operationId: getListsListEntries
            summary: 'List my entries'
            x-required-ability: 'lists:read'
            parameters:
                - $ref: '#/components/parameters/List'
                - $ref: '#/components/parameters/Page'
            responses:
                '200':
                    description: Entries
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntryPage'
                            example:
                                data:
                                    - id: 27381
                                      list_id: 9185
                                      game_id: 407746
                                      sort_order: 10
