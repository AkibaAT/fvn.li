x-fvnli: &fvnli
  image: ${DOCKER_IMAGE}
x-db: &db
  image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
x-flaresolverr: &flaresolverr
  image: flaresolverr/flaresolverr:v3.5.0@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
x-meilisearch: &meilisearch
  image: getmeili/meilisearch:v1.53@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
x-redis: &redis
  image: redis:8.10.1@sha256:691577adaf11927f4bb8871d40a5dd69a5c300d4453b742e8f6383c3e6e8d2e1
x-denkit-stash: &denkit-stash
  image: ${DENKIT_STASH_IMAGE}
x-rustfs: &rustfs
  image: ${RUSTFS_DOCKER_IMAGE:-rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3}

services:
  app:
    <<: *fvnli
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
      stats-runner:
        condition: service_started
      denkit-stash:
        condition: service_healthy
    environment: &app-environment
      - QUEUE_CONNECTION=redis
      - LOG_STACK=daily
      - DISCORD_BOT_ENABLED=${DISCORD_BOT_ENABLED:-false}
      - DISCORD_DM_ENABLED=${DISCORD_DM_ENABLED:-false}
      - DISCORD_SERVER_BOT_ENABLED=${DISCORD_SERVER_BOT_ENABLED:-false}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - RENPY_ANALYSIS_MODE=${RENPY_ANALYSIS_MODE:-sandbox}
      - RENPY_ANALYZER_URL=${RENPY_ANALYZER_URL:-http://stats-runner:8080/api/renpy-analyzer/analyze}
      - RENPY_ANALYZER_TOKEN=${RENPY_ANALYZER_TOKEN}
      - RENPY_ANALYZER_TIMEOUT=${RENPY_ANALYZER_TIMEOUT:-900}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      - DENKIT_STASH_URL=${DENKIT_STASH_URL:-http://denkit-stash:8081}
      - DENKIT_STASH_USERNAME=${DENKIT_STASH_USERNAME:-fvn-li}
      - DENKIT_STASH_API_KEY=${DENKIT_STASH_API_KEY}
      - BUTLER_CLIENT_PATH=${BUTLER_CLIENT_PATH:-/opt/butler}
      - ARCHIVE_OPTIMIZER_IMAGE=${DOCKER_IMAGE}
      - ARCHIVE_OPTIMIZER_TIMEOUT=${ARCHIVE_OPTIMIZER_TIMEOUT:-1800}
      - ARCHIVE_OPTIMIZER_MEMORY=${ARCHIVE_OPTIMIZER_MEMORY:-6g}
      - ARCHIVE_OPTIMIZER_HOST_APP_DIR=${ARCHIVE_OPTIMIZER_HOST_APP_DIR:-${PWD}}
      - ARCHIVE_OPTIMIZER_HOST_WORK_DIR=/var/lib/fvn-archive-optimizer/${COMPOSE_PROJECT_NAME}
      - ARCHIVE_OPTIMIZER_CONTAINER_WORK_DIR=/optimizer-work
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      fvnli:
        aliases:
          - laravel-app
      flaresolverr:
      web:
    volumes: &app-volumes
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
      - /opt/renpy-sdk:/opt/renpy-sdk:ro
      - /var/lib/fvn-archive-optimizer/${COMPOSE_PROJECT_NAME}:/optimizer-work
      - /var/log/fvn/${COMPOSE_PROJECT_NAME}:/app/storage/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https"
  scheduler:
    <<: *fvnli
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    networks:
      - fvnli
      - flaresolverr
    volumes: *app-volumes
  stats-runner:
    <<: *fvnli
    restart: unless-stopped
    working_dir: /app/public
    entrypoint:
      - php
      - -S
      - 0.0.0.0:8080
      - ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    environment:
      - APP_CONFIG_CACHE=/app/bootstrap/cache/config-stats-runner.php
      - RENPY_ANALYZER_SERVER=true
      - RENPY_ANALYZER_TOKEN=${RENPY_ANALYZER_TOKEN}
      - RENPY_ANALYZER_IMAGE=${DOCKER_IMAGE}
      - RENPY_ANALYZER_TIMEOUT=${RENPY_ANALYZER_TIMEOUT:-900}
      - RENPY_ANALYZER_MEMORY=${RENPY_ANALYZER_MEMORY:-3g}
      - RENPY_ANALYZER_HOST_WORK_DIR=/var/lib/fvn-renpy-analyzer/${COMPOSE_PROJECT_NAME}
      - RENPY_ANALYZER_CONTAINER_WORK_DIR=/runner-work
      - RENPY_SDK_DOCKER_HOST_PATH=${RENPY_SDK_DOCKER_HOST_PATH:-/opt/renpy-sdk}
      - RENPY_SDK_PATH=/opt/renpy-sdk
    volumes:
      - app_storage:/app/storage
      - /opt/renpy-sdk:/opt/renpy-sdk:ro
      - /var/lib/fvn-renpy-analyzer/${COMPOSE_PROJECT_NAME}:/runner-work
      - /var/log/fvn/${COMPOSE_PROJECT_NAME}:/app/storage/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/
  denkit-stash:
    <<: *denkit-stash
    restart: unless-stopped
    command: ["./denkit-stash", "--port=8081"]
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      fvnli:
        aliases:
          - api.denkit-stash
    environment:
      - POSTGRES_HOST=${DENKIT_STASH_POSTGRES_HOST:-db}
      - POSTGRES_PORT=${DENKIT_STASH_POSTGRES_PORT:-5432}
      - POSTGRES_DB=${DENKIT_STASH_POSTGRES_DATABASE:-butler}
      - POSTGRES_USER=${DENKIT_STASH_POSTGRES_USERNAME:-denkit_stash}
      - POSTGRES_PASSWORD=${DENKIT_STASH_POSTGRES_PASSWORD}
      - S3_ENDPOINT=http://rustfs:9000
      # Host must match the rustfs Traefik router below, or presigned URLs
      # point at a name nothing routes.
      - S3_PUBLIC_ENDPOINT=https://${DENKIT_STASH_S3_PUBLIC_HOST:-s3.${APP_DOMAIN}}
      - S3_ACCESS_KEY=${DENKIT_STASH_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${DENKIT_STASH_S3_SECRET_KEY}
      - S3_BUCKET=${DENKIT_STASH_S3_BUCKET:-denkit-stash-storage}
      - S3_REGION=${DENKIT_STASH_S3_REGION:-us-east-1}
      - S3_USE_SSL=false
      - ENABLE_DEV_ENDPOINTS=false
      - DENKIT_API_KEY_HASH_SECRET=${DENKIT_API_KEY_HASH_SECRET}
      - DENKIT_HTTP_READ_HEADER_TIMEOUT=5s
      - DENKIT_HTTP_READ_TIMEOUT=${DENKIT_HTTP_READ_TIMEOUT:-30m}
      - DENKIT_HTTP_WRITE_TIMEOUT=${DENKIT_HTTP_WRITE_TIMEOUT:-30m}
      - DENKIT_HTTP_IDLE_TIMEOUT=2m
      # Archive cache eviction (opt-in): stash keeps patches+signatures
      # permanently and can rebuild full archives on demand, so stale non-head
      # archives may be deleted from S3 once this flag is enabled.
      - DENKIT_ARCHIVE_GC_ENABLED=${DENKIT_ARCHIVE_GC_ENABLED:-false}
      - DENKIT_ARCHIVE_TTL=${DENKIT_ARCHIVE_TTL:-720h}
      - DENKIT_ARCHIVE_GC_INTERVAL=${DENKIT_ARCHIVE_GC_INTERVAL:-1h}
      - DENKIT_ARCHIVE_GC_BATCH=${DENKIT_ARCHIVE_GC_BATCH:-100}
      - DENKIT_ARCHIVE_REBUILD_TIMEOUT=${DENKIT_ARCHIVE_REBUILD_TIMEOUT:-20m}
      # Disk-backed staging for archive generation/rebuilds; games run to
      # multiple GB, so keep this off tmpfs and off the container layer.
      - TMPDIR=/scratch
    volumes:
      - denkit_stash_scratch:/scratch
  rustfs:
    <<: *rustfs
    restart: unless-stopped
    command: ["--address", ":9000", "--console-enable", "/data"]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - fvnli
      - web
    labels:
      # Exposes only the S3 API (port 9000) for presigned-URL downloads.
      # The console stays internal (port 9001 is never routed).
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-rustfs.rule=Host(`${DENKIT_STASH_S3_PUBLIC_HOST:-s3.${APP_DOMAIN}}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-rustfs.entrypoints=https"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-rustfs.tls=true"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-rustfs.loadbalancer.server.port=9000"
    environment:
      - RUSTFS_ACCESS_KEY=${DENKIT_STASH_S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${DENKIT_STASH_S3_SECRET_KEY}
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_REGION=${DENKIT_STASH_S3_REGION:-us-east-1}
    volumes:
      - denkit_stash_rustfs:/data
  db:
    <<: *db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=10MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DENKIT_STASH_POSTGRES_DATABASE=${DENKIT_STASH_POSTGRES_DATABASE:-butler}
      - DENKIT_STASH_POSTGRES_USERNAME=${DENKIT_STASH_POSTGRES_USERNAME:-denkit_stash}
      - DENKIT_STASH_POSTGRES_PASSWORD=${DENKIT_STASH_POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
      - ${PWD}/scripts/postgres-init-denkit-stash.sh:/docker-entrypoint-initdb.d/10-denkit-stash.sh:ro
    deploy:
      resources:
        limits:
          memory: 8GB
        reservations:
          memory: 4GB
  meilisearch:
    <<: *meilisearch
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${MEILISEARCH_HOST_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=${MEILI_ENV:-production}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_LOG_LEVEL=INFO
      - MEILI_MAX_INDEXING_MEMORY=2GB
      - MEILI_MAX_INDEXING_THREADS=2
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    volumes:
      - meilisearch:/meili_data
    deploy:
      resources:
        limits:
          memory: 4GB
        reservations:
          memory: 2GB
  redis:
    <<: *redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - "60"
      - "1"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fvnli
    volumes:
      - redis:/data
  flaresolverr:
    <<: *flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=UTC
      - HEADLESS=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8191/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flaresolverr
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          memory: 512MB
  social-image-generator:
    image: ${DOCKER_IMAGE_SOCIAL_IMAGES}
    restart: "no"
    user: pwuser
    shm_size: 1gb
    security_opt:
      - seccomp=${PWD}/seccomp_profile.json
    profiles:
      - tools
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fvnli
    environment:
      - BASE_URL=http://laravel-app
      - OUTPUT_DIR=/app/storage/app/public/social-images
    volumes:
      - app_storage:/app/storage

volumes:
  app_storage:
    name: ${COMPOSE_PROJECT_NAME}_app_storage
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  db:
    name: ${COMPOSE_PROJECT_NAME}_db
  meilisearch:
    name: ${COMPOSE_PROJECT_NAME}_meilisearch
  redis:
    name: ${COMPOSE_PROJECT_NAME}_redis
  denkit_stash_rustfs:
    name: ${COMPOSE_PROJECT_NAME}_denkit_stash_rustfs
  denkit_stash_scratch:
    name: ${COMPOSE_PROJECT_NAME}_denkit_stash_scratch

networks:
  fvnli:
    name: ${COMPOSE_PROJECT_NAME}
  flaresolverr:
    name: ${COMPOSE_PROJECT_NAME}_flaresolverr
  web:
    name: web
    external: true
