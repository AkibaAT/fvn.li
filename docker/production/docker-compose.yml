x-fvnli: &fvnli
  image: ${DOCKER_IMAGE}
x-db: &db
  image: postgres:18.4@sha256:775a0820dd34e907ec63277e388d145056d427548e461d7953a070edb5de3a3a
x-meilisearch: &meilisearch
  image: getmeili/meilisearch:v1.23@sha256:bac1af7afd5a19b72ec57a660cbb09704926b75ad709ad514ed2f7cf01675256
x-redis: &redis
  image: redis:8.6.3@sha256:0c341492924cad6f5483f9133e43bd6c51ecdecbcadfac5b51657393b6a7936c

services:
  app:
    <<: *fvnli
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
      stats-runner:
        condition: service_started
    environment:
      - RENPY_ANALYSIS_MODE=${RENPY_ANALYSIS_MODE:-sandbox}
      - RENPY_ANALYZER_URL=${RENPY_ANALYZER_URL:-http://stats-runner:8080/api/renpy-analyzer/analyze}
      - RENPY_ANALYZER_TOKEN=${RENPY_ANALYZER_TOKEN}
      - RENPY_ANALYZER_TIMEOUT=${RENPY_ANALYZER_TIMEOUT:-300}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
      - flaresolverr
      - web
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
      - /opt/renpy-sdk:/opt/renpy-sdk:ro
      - /var/log/fvn/${COMPOSE_PROJECT_NAME}:/app/storage/logs
      - ./:/app/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https"
  stats-runner:
    <<: *fvnli
    restart: unless-stopped
    working_dir: /app/public
    entrypoint:
      - php
      - -S
      - 0.0.0.0:8080
      - ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fvnli
    environment:
      - RENPY_ANALYZER_SERVER=true
      - RENPY_ANALYZER_TOKEN=${RENPY_ANALYZER_TOKEN}
      - RENPY_ANALYZER_IMAGE=${DOCKER_IMAGE}
      - RENPY_ANALYZER_TIMEOUT=${RENPY_ANALYZER_TIMEOUT:-300}
      - RENPY_ANALYZER_HOST_WORK_DIR=/var/lib/fvn-renpy-analyzer/${COMPOSE_PROJECT_NAME}
      - RENPY_ANALYZER_CONTAINER_WORK_DIR=/runner-work
      - RENPY_SDK_DOCKER_HOST_PATH=${RENPY_SDK_DOCKER_HOST_PATH:-/opt/renpy-sdk}
      - RENPY_SDK_PATH=/opt/renpy-sdk
    volumes:
      - app_storage:/app/storage
      - /opt/renpy-sdk:/opt/renpy-sdk:ro
      - /var/lib/fvn-renpy-analyzer/${COMPOSE_PROJECT_NAME}:/runner-work
      - /var/log/fvn/${COMPOSE_PROJECT_NAME}:/app/storage/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app/
  db:
    <<: *db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=10MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 8GB
        reservations:
          memory: 4GB
  meilisearch:
    <<: *meilisearch
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${MEILISEARCH_HOST_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=${MEILI_ENV:-production}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_LOG_LEVEL=INFO
      - MEILI_MAX_INDEXING_MEMORY=2GB
      - MEILI_MAX_INDEXING_THREADS=2
    volumes:
      - meilisearch:/meili_data
    deploy:
      resources:
        limits:
          memory: 4GB
        reservations:
          memory: 2GB
  redis:
    <<: *redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - "60"
      - "1"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fvnli
    volumes:
      - redis:/data
  flaresolverr:
    image: flaresolverr/flaresolverr:latest@sha256:7962759d99d7e125e108e0f5e7f3cdbcd36161776d058d1d9b7153b92ef1af9e
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=UTC
      - HEADLESS=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8191/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flaresolverr
    deploy:
      resources:
        limits:
          memory: 2GB
        reservations:
          memory: 512MB
  social-image-generator:
    image: ${DOCKER_IMAGE_SOCIAL_IMAGES}
    restart: "no"
    user: pwuser
    shm_size: 1gb
    security_opt:
      - seccomp=${PWD}/seccomp_profile.json
    profiles:
      - tools
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fvnli
    environment:
      - BASE_URL=https://${APP_DOMAIN}
      - OUTPUT_DIR=/app/storage/app/public/social-images
    volumes:
      - app_storage:/app/storage

volumes:
  app_storage:
    name: ${COMPOSE_PROJECT_NAME}_app_storage
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  db:
    name: ${COMPOSE_PROJECT_NAME}_db
  meilisearch:
    name: ${COMPOSE_PROJECT_NAME}_meilisearch
  redis:
    name: ${COMPOSE_PROJECT_NAME}_redis

networks:
  fvnli:
    name: ${COMPOSE_PROJECT_NAME}
  flaresolverr:
    name: ${COMPOSE_PROJECT_NAME}_flaresolverr
  web:
    name: web
    external: true
