x-fvnli: &fvnli
  image: ${DOCKER_IMAGE}
x-db: &db
  image: postgres:17.6
x-meilisearch: &meilisearch
  image: getmeili/meilisearch:v1.23
x-redis: &redis
  image: redis:8

services:
  app:
    <<: *fvnli
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
      - web
    volumes:
      - app_storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
      - /opt/renpy-sdk:/opt/renpy-sdk
      - /var/log/fvn/${COMPOSE_PROJECT_NAME}:/app/storage/logs
      - ./:/app/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=https"
  db:
    <<: *db
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=6GB"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
  meilisearch:
    <<: *meilisearch
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fvnli
    ports:
      - "127.0.0.1:${MEILISEARCH_HOST_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_ENV=${MEILI_ENV:-production}
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_LOG_LEVEL=INFO
    volumes:
      - meilisearch:/meili_data
  redis:
    <<: *redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - "60 1"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fvnli
    volumes:
      - redis:/data
  social-image-generator:
    image: ${DOCKER_IMAGE_SOCIAL_IMAGES}
    restart: "no"
    profiles:
      - tools
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fvnli
    environment:
      - BASE_URL=https://${APP_DOMAIN}
      - OUTPUT_DIR=/app/storage/app/public/social-images
    volumes:
      - app_storage:/app/storage

volumes:
  app_storage:
    name: ${COMPOSE_PROJECT_NAME}_app_storage
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  db:
    name: ${COMPOSE_PROJECT_NAME}_db
  meilisearch:
    name: ${COMPOSE_PROJECT_NAME}_meilisearch
  redis:
    name: ${COMPOSE_PROJECT_NAME}_redis

networks:
  fvnli:
    name: ${COMPOSE_PROJECT_NAME}
  web:
    name: web
    external: true
