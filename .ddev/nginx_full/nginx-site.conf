# ddev laravel config
# https://laravel.com/docs/deployment#nginx

## Local override: Taken over from DDEV's generated config.
## DDEV will not overwrite this file because the marker was removed.

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    root /var/www/html/public;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.html index.htm index.php;

    charset utf-8;

    # Disable sendfile as per https://docs.vagrantup.com/v2/synced-folders/virtualbox.html
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Select Laravel environment file based on requested host
    # Default to .env, use .env.testing for the testing FQDN
    set $app_env local;
    if ($host = fvn-li-testing.ddev.site) {
        set $app_env testing;
    }

    # Handle static files first - return 404 if not found instead of routing to Laravel
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|pdf|zip|txt)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Handle storage files with special handling for collage images
    location ^~ /storage/ {
        # Special handling for collage images - fallback to social-fallback.jpg
        location ~ ^/storage/social-images/collage_.*\.(webp|jpg|jpeg|png)$ {
            try_files $uri /images/social-fallback.jpg;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        # Default behavior for other storage files
        try_files $uri =404;
        access_log off;
    }

    # Handle build assets specifically - return 404 if not found
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Default location for Laravel routes - only for non-static files
    location / {
        absolute_redirect off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only route PHP 404s to Laravel, not static file 404s
    error_page 404 @laravel_404;

    location @laravel_404 {
        # Only route to Laravel if it's not a static file request
        if ($uri ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|pdf|zip|txt)$) {
            return 404;
        }
        rewrite ^.*$ /index.php last;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        # fastcgi_read_timeout should match max_execution_time in php.ini
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_param APP_ENV $app_env;
        # Pass the X-Accel-* headers to facilitate testing.
        fastcgi_pass_header "X-Accel-Buffering";
        fastcgi_pass_header "X-Accel-Charset";
        fastcgi_pass_header "X-Accel-Expires";
        fastcgi_pass_header "X-Accel-Limit-Rate";
        fastcgi_pass_header "X-Accel-Redirect";
    }

    # Prevent clients from accessing hidden files (starting with a dot)
    # This is particularly important if you store .htpasswd files in the site hierarchy
    # Access to `/.well-known/` is allowed.
    # https://www.mnot.net/blog/2010/04/07/well-known
    # https://tools.ietf.org/html/rfc5785
    location ~* /\.(?!well-known\/) {
        deny all;
    }

    # Prevent clients from accessing to backup/config/source files
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # Fix: File upload over https fails signature verification
    #      https://github.com/livewire/livewire/discussions/3084
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$args;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
