# Meilisearch service for DDEV

services:
  meilisearch:
    image: getmeili/meilisearch:v1.53@sha256:c94e58ca09662dd6e65e8f1b0fd145767be3da7d5422a863a27b8d2b68e090c9
    restart: unless-stopped
    command: meilisearch --upgrade-db
    container_name: ddev-${DDEV_SITENAME}-meilisearch
    hostname: ${DDEV_SITENAME}-meilisearch
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    environment:
      - MEILI_MASTER_KEY=dev-master-key-change-in-production
      - MEILI_ENV=development
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_LOG_LEVEL=DEBUG
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - ddev_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  meilisearch_data:
    name: ${DDEV_SITENAME}_meilisearch_data
