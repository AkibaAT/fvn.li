services:
  web:
    environment:
      DENKIT_STASH_URL: http://denkit-stash:8081
      DENKIT_STASH_PUBLIC_URL: https://denkit-stash-fvn-li.ddev.site
      DENKIT_STASH_USERNAME: fvn-li
      DENKIT_STASH_API_KEY: fvn-li-local-denkit-api-key
      BUTLER_CLIENT_PATH: /opt/butler

  denkit-stash:
    container_name: ddev-${DDEV_SITENAME}-denkit-stash
    image: ${DENKIT_STASH_IMAGE:-ghcr.io/akibaat/denkit-stash:development}
    command: ["./denkit-stash", "--port=8081"]
    expose:
      - "8081"
    networks:
      default:
        aliases:
          - api.denkit-stash
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: butler
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ddevminio
      MINIO_SECRET_KEY: ddevminio
      MINIO_BUCKET: butler-storage
      MINIO_USE_SSL: "false"
      ENABLE_DEV_ENDPOINTS: "false"
      DENKIT_API_KEY_HASH_SECRET: fvn-li-local-denkit-hash-secret
      DENKIT_HTTP_READ_HEADER_TIMEOUT: 5s
      DENKIT_HTTP_READ_TIMEOUT: 30m
      DENKIT_HTTP_WRITE_TIMEOUT: 30m
      DENKIT_HTTP_IDLE_TIMEOUT: 2m
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/"]
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 5s
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

  minio:
    container_name: ddev-${DDEV_SITENAME}-minio
    image: ${MINIO_DOCKER_IMAGE:-minio/minio:latest}
    environment:
      MINIO_VOLUMES: /data
      MC_CONFIG_DIR: /root/.mc
      MINIO_UID: $DDEV_UID
      MINIO_GID: $DDEV_GID
      MINIO_ROOT_USER: ddevminio
      MINIO_ROOT_PASSWORD: ddevminio
    command: server --console-address :9090 --address :9000
    expose:
      - "9000"
      - "9090"
    volumes:
      - denkit-stash-minio:/data
      - .:/mnt/ddev_config
      - ddev-global-cache:/mnt/ddev-global-cache
      - type: volume
        source: ddev-global-cache
        target: /root/.minio/certs/CAs
        volume:
          subpath: mkcert
    configs:
      - source: denkit-stash-mc-config.json
        target: /root/.mc/config.json
        mode: "0444"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    external_links:
      - ddev-router:${DDEV_SITENAME}.${DDEV_TLD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 5s
    restart: "no"

  db:
    volumes:
      - ./postgres/10-create-denkit-stash-database.sql:/docker-entrypoint-initdb.d/10-create-denkit-stash-database.sql:ro

configs:
  denkit-stash-mc-config.json:
    content: |
      {
        "version": "10",
        "aliases": {
          "minio": {
            "url": "http://minio:9000",
            "accessKey": "ddevminio",
            "secretKey": "ddevminio",
            "api": "s3v4",
            "path": "auto"
          }
        }
      }

volumes:
  denkit-stash-minio:
    name: ddev-${DDEV_SITENAME}-denkit-stash-minio
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
