services:
  web:
    # Grants access to the mounted docker socket; override via DOCKER_SOCKET_GID in .ddev/.env
    # if the host's docker group has a different gid (stat -c %g /var/run/docker.sock).
    group_add:
      - "${DOCKER_SOCKET_GID:-975}"
    environment:
      DENKIT_STASH_URL: http://denkit-stash:8081
      DENKIT_STASH_USERNAME: fvn-li
      DENKIT_STASH_API_KEY: fvn-li-local-denkit-api-key
      BUTLER_CLIENT_PATH: /opt/butler
      ARCHIVE_OPTIMIZER_IMAGE: ddev/ddev-webserver:${DDEV_VERSION}-${DDEV_SITENAME}-built
      ARCHIVE_OPTIMIZER_PHP_BINARY: php8.5
      ARCHIVE_OPTIMIZER_APP_PATH: /var/www/html
      ARCHIVE_OPTIMIZER_TIMEOUT: ${ARCHIVE_OPTIMIZER_TIMEOUT:-1800}
      ARCHIVE_OPTIMIZER_MEMORY: ${ARCHIVE_OPTIMIZER_MEMORY:-6g}
      ARCHIVE_OPTIMIZER_HOST_APP_DIR: ${DDEV_APPROOT}
      ARCHIVE_OPTIMIZER_HOST_WORK_DIR: ${DDEV_APPROOT}/.ddev/.archive-optimizer
      ARCHIVE_OPTIMIZER_CONTAINER_WORK_DIR: /optimizer-work
    volumes:
      - ${DDEV_APPROOT}/.ddev/.archive-optimizer:/optimizer-work
      - /var/run/docker.sock:/var/run/docker.sock

  denkit-stash:
    container_name: ddev-${DDEV_SITENAME}-denkit-stash
    image: ${DENKIT_STASH_IMAGE:-ghcr.io/akibaat/denkit-stash:development@sha256:ac71354cd775171f67f86832fe13e5a248c0bde8dbf6d52d569035c6ce38aa10}
    command: ["./denkit-stash", "--port=8081"]
    expose:
      - "8081"
    networks:
      default:
        aliases:
          - api.denkit-stash
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: butler
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      S3_ENDPOINT: http://rustfs:9000
      # Presigned download URLs must resolve from the host browser; the
      # ddev router exposes the S3 API on 9092 (see the rustfs service).
      S3_PUBLIC_ENDPOINT: https://${DDEV_SITENAME}.ddev.site:9092
      S3_ACCESS_KEY: ddevrustfs
      S3_SECRET_KEY: ddevrustfs
      S3_BUCKET: denkit-storage
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      ENABLE_DEV_ENDPOINTS: "false"
      DENKIT_API_KEY_HASH_SECRET: fvn-li-local-denkit-hash-secret
      DENKIT_HTTP_READ_HEADER_TIMEOUT: 5s
      DENKIT_HTTP_READ_TIMEOUT: 30m
      DENKIT_HTTP_WRITE_TIMEOUT: 30m
      DENKIT_HTTP_IDLE_TIMEOUT: 2m
      # Archive cache eviction (opt-in); override via .ddev/.env to test
      # eviction + rebuild-on-demand locally, e.g. TTL 1m / interval 1m.
      DENKIT_ARCHIVE_GC_ENABLED: ${DENKIT_ARCHIVE_GC_ENABLED:-false}
      DENKIT_ARCHIVE_TTL: ${DENKIT_ARCHIVE_TTL:-720h}
      DENKIT_ARCHIVE_GC_INTERVAL: ${DENKIT_ARCHIVE_GC_INTERVAL:-1h}
      DENKIT_ARCHIVE_GC_BATCH: ${DENKIT_ARCHIVE_GC_BATCH:-100}
      DENKIT_ARCHIVE_REBUILD_TIMEOUT: ${DENKIT_ARCHIVE_REBUILD_TIMEOUT:-20m}
      # Disk-backed staging for archive generation/rebuilds (parity with prod).
      TMPDIR: /scratch
    volumes:
      - denkit-stash-scratch:/scratch
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/"]
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 5s
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

  rustfs:
    container_name: ddev-${DDEV_SITENAME}-rustfs
    image: ${RUSTFS_DOCKER_IMAGE:-rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3}
    environment:
      RUSTFS_ACCESS_KEY: ddevrustfs
      RUSTFS_SECRET_KEY: ddevrustfs
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_REGION: us-east-1
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      # 9091 -> S3 console (internal tooling), 9092 -> S3 API (public endpoint
      # for presigned downloads; parity with Traefik's s3.${APP_DOMAIN} in prod).
      HTTPS_EXPOSE: 9091:9001,9092:9000
    command: ["--address", ":9000", "--console-enable", "/data"]
    expose:
      - "9000"
      - "9001"
    volumes:
      - denkit-stash-rustfs:/data
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 1s
      timeout: 5s
      retries: 120
      start_period: 5s
    restart: "no"

  db:
    volumes:
      - ./postgres/10-create-denkit-stash-database.sql:/docker-entrypoint-initdb.d/10-create-denkit-stash-database.sql:ro

volumes:
  denkit-stash-rustfs:
    name: ddev-${DDEV_SITENAME}-denkit-stash-rustfs
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
  denkit-stash-scratch:
    name: ddev-${DDEV_SITENAME}-denkit-stash-scratch
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
