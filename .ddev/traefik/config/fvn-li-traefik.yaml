http:
    routers:
        fvn-li-vite-http:
            entrypoints:
                - http-80
            rule: (HostRegexp(`^fvn-li\.ddev\.site$`) || HostRegexp(`^fvn-li-testing\.ddev\.site$`)) && PathPrefix(`/@vite/`)
            service: 'fvn-li-web-5273'
            tls: false
            priority: 100
        fvn-li-vite-https:
            entrypoints:
                - http-443
            rule: (HostRegexp(`^fvn-li\.ddev\.site$`) || HostRegexp(`^fvn-li-testing\.ddev\.site$`)) && PathPrefix(`/@vite/`)
            service: 'fvn-li-web-5273'
            tls: true
            priority: 100
        fvn-li-denkit-stash-http:
            entrypoints:
                - http-80
            rule: HostRegexp(`^denkit-stash-fvn-li\.ddev\.site$`)
            service: 'fvn-li-denkit-stash-8081'
            tls: false
            priority: 10000
        fvn-li-denkit-stash-https:
            entrypoints:
                - http-443
            rule: HostRegexp(`^denkit-stash-fvn-li\.ddev\.site$`)
            service: 'fvn-li-denkit-stash-8081'
            tls: true
            priority: 10000
    services:
        fvn-li-denkit-stash-8081:
            loadbalancer:
                servers:
                    - url: http://ddev-fvn-li-denkit-stash:8081

tls:
    certificates:
        - certFile: /mnt/ddev-global-cache/traefik/certs/fvn-li.crt
          keyFile: /mnt/ddev-global-cache/traefik/certs/fvn-li.key
