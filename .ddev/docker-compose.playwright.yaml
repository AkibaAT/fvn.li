services:
  playwright:
    container_name: ddev-${DDEV_SITENAME}-playwright
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    init: true
    ipc: host
    working_dir: /home/pwuser
    user: pwuser
    command:
      - /bin/sh
      - -c
      - |
        package=/var/www/html/node_modules/playwright-core
        installed_version() {
          node -p "require('$$package/package.json').version" 2>/dev/null
        }

        while true; do
          until version=$$(installed_version); do
            sleep 2
          done

          node "$$package/cli.js" install chromium
          node "$$package/cli.js" run-server --port 3000 --host 0.0.0.0 &
          server=$$!

          while kill -0 "$$server" 2>/dev/null && [ "$$(installed_version)" = "$$version" ]; do
            sleep 5
          done

          kill "$$server" 2>/dev/null
          wait "$$server" 2>/dev/null
        done
    volumes:
      - ${DDEV_APPROOT}:/var/www/html:ro
    expose:
      - "3000"
    external_links:
      - ddev-router:${DDEV_HOSTNAME}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
