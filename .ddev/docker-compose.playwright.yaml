services:
  playwright:
    container_name: ddev-${DDEV_SITENAME}-playwright
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    init: true
    ipc: host
    working_dir: /home/pwuser
    user: pwuser
    command:
      - /bin/sh
      - -c
      - npx -y playwright@1.62.1 run-server --port 3000 --host 0.0.0.0
    expose:
      - "3000"
    external_links:
      - ddev-router:${DDEV_HOSTNAME}
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
